<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd66b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="番茄伙伴" />
    <title>番茄伙伴</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=11" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="top-bar">
        <strong>9:41</strong>
        <span class="phone-icons"><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span>
      </header>

      <main class="app-content">
        <section class="app-section timer-view active-view" id="timer">
          <div class="hero-row">
            <div>
              <h1>Hi，朋友 · 👋</h1>
              <p>专注是通往梦想的桥梁！</p>
            </div>
            <div class="round-actions">
              <button aria-label="统计"><i data-lucide="bar-chart-3"></i></button>
              <button aria-label="设置"><i data-lucide="settings"></i></button>
            </div>
          </div>

          <div class="room-scene" aria-hidden="true">
            <div class="window-art"><span></span></div>
            <div class="heart-bubble">❤</div>
            <div class="note-card">加油！</div>
            <div class="plant-art"></div>
          </div>

          <article class="tomato-stage">
            <div class="mascot">
              <img src="assets/dog-mascot.png?v=2" alt="小黄狗" />
            </div>
            <div class="tomato-timer">
              <div class="tomato-leaf"></div>
              <div class="timer-pill">
                <span id="timerMode">专注时间</span>
                <button aria-label="说明"><i data-lucide="help-circle"></i></button>
              </div>
              <strong id="timeLeft">25:00</strong>
              <div class="tomato-scale">
                <span>30</span>
                <span>25</span>
                <span>20</span>
              </div>
            </div>
          </article>

          <div class="mode-switch" role="tablist" aria-label="计时模式">
            <button class="selected" data-mode="focus">25</button>
            <button data-mode="short">5</button>
            <button data-mode="long">15</button>
          </div>

          <form class="custom-time-form" id="customTimeForm">
            <label for="customMinutes">自定义</label>
            <input id="customMinutes" type="number" min="1" max="240" step="1" value="25" inputmode="numeric" />
            <button type="submit">应用</button>
          </form>

          <div class="timer-actions">
            <button class="primary" id="startPause"><i data-lucide="play"></i><span>开始专注</span></button>
            <button id="resetTimer" aria-label="重置"><i data-lucide="rotate-ccw"></i></button>
          </div>
          <button class="break-button" id="completePomodoro"><i data-lucide="coffee"></i><span>短休息 5 分钟</span><i data-lucide="chevron-right"></i></button>

          <section class="today-card">
            <div class="card-title">
              <span>🍅 今日专注</span>
              <i data-lucide="chevron-right"></i>
            </div>
            <div class="today-stats">
              <div>
                <span>🕘 专注次数</span>
                <strong><b id="pomodoroCount">0</b> 次</strong>
              </div>
              <div>
                <span>🎯 专注时长</span>
                <strong><b id="focusMinutes">0</b> 分钟</strong>
              </div>
              <div>
                <span>⭐ 完成任务</span>
                <strong><b id="todayPlanCount">0</b> 个</strong>
              </div>
            </div>
          </section>
        </section>

        <section class="app-section" id="plans">
          <div class="page-heading">
            <h2>任务</h2>
            <p>把今天要做的事排好队。</p>
          </div>
          <form class="plan-form" id="planForm">
            <input id="planTitle" type="text" placeholder="新增任务" autocomplete="off" />
            <input id="planDate" type="date" />
            <select id="planPriority" aria-label="优先级">
              <option value="高">高</option>
              <option value="中" selected>中</option>
              <option value="低">低</option>
            </select>
            <button type="submit" class="primary" aria-label="新增任务"><i data-lucide="plus"></i></button>
          </form>
          <div class="view-tabs" aria-label="任务筛选">
            <button class="selected" data-filter="all">全部</button>
            <button data-filter="today">今天</button>
            <button data-filter="done">完成</button>
          </div>
          <div class="list" id="planList"></div>
        </section>

        <section class="app-section" id="checkins">
          <div class="page-heading">
            <h2>专注记录</h2>
            <p>记录每一次认真坐下来的时刻。</p>
          </div>
          <form class="inline-form" id="habitForm">
            <input id="habitName" type="text" placeholder="例如：读论文 30 分钟" autocomplete="off" />
            <button type="submit" class="primary" aria-label="新增记录"><i data-lucide="plus"></i></button>
          </form>
          <div class="list" id="habitList"></div>
        </section>

        <section class="app-section" id="subscriptions">
          <div class="page-heading">
            <h2>我的</h2>
            <p>订阅、打卡和小目标都放这里。</p>
          </div>
          <section class="profile-card">
            <div class="profile-avatar">🐶</div>
            <div>
              <strong>朋友</strong>
              <span>今日打卡 <b id="streakDays">0/0</b></span>
            </div>
          </section>
          <form class="subscription-form" id="subscriptionForm">
            <input id="subName" type="text" placeholder="会员服务" autocomplete="off" />
            <input id="subPrice" type="number" min="0" step="1" placeholder="月费" />
            <input id="subRenewal" type="date" />
            <button type="submit" class="primary" aria-label="新增订阅"><i data-lucide="plus"></i></button>
          </form>
          <div class="my-total">本月订阅：<strong id="monthlySpend">¥0</strong></div>
          <div class="list" id="subscriptionList"></div>
        </section>
      </main>

      <nav class="bottom-tabs" aria-label="底部导航">
        <a href="#timer" class="active"><span class="tab-icon">🍅</span><span>番茄钟</span></a>
        <a href="#plans"><span class="tab-icon">📋</span><span>任务</span></a>
        <a href="#checkins"><span class="tab-icon">🗓️</span><span>专注记录</span></a>
        <a href="#subscriptions"><span class="tab-icon">🐶</span><span>我的</span></a>
      </nav>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="app.js?v=11"></script>
  </body>
</html>
