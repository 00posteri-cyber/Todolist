<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFB800" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FocusDog" />
    <title>FocusDog</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=13" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="status-bar">
        <strong>9:41</strong>
        <span><i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i></span>
      </header>

      <main class="app-content">
        <section class="app-section focus-page active-view" id="timer">
          <header class="page-header">
            <div>
              <p class="eyebrow">FocusDog</p>
              <h1>Hi，朋友 👋</h1>
              <p>大黄狗陪你把专注养成习惯。</p>
            </div>
            <button class="icon-circle" data-jump="checkins" aria-label="专注统计"><i data-lucide="bar-chart-3"></i></button>
          </header>

          <section class="dog-hero">
            <img src="assets/dog-mascot.png?v=2" alt="大黄狗" />
          </section>

          <section class="tomato-focus-card">
            <div class="timer-label">
              <span id="timerMode">专注时间</span>
              <button aria-label="说明"><i data-lucide="help-circle"></i></button>
            </div>
            <strong id="timeLeft">25:00</strong>
            <div class="timer-scale">
              <span>30</span><span>25</span><span>20</span>
            </div>
          </section>

          <button class="primary-button" id="startPause"><i data-lucide="play"></i><span>开始专注</span></button>

          <section class="mode-panel">
            <div class="mode-switch" role="tablist" aria-label="计时模式">
              <button class="selected" data-mode="focus">25</button>
              <button data-mode="short">5</button>
              <button data-mode="long">15</button>
            </div>
            <form class="custom-time-form" id="customTimeForm">
              <label for="customMinutes">自定义</label>
              <input id="customMinutes" type="number" min="1" max="240" step="1" value="25" inputmode="numeric" />
              <button type="submit">应用</button>
            </form>
            <button class="secondary-button" id="completePomodoro"><i data-lucide="coffee"></i><span>完成并短休息</span></button>
            <button class="reset-button" id="resetTimer" aria-label="重置"><i data-lucide="rotate-ccw"></i></button>
          </section>

          <section class="summary-card">
            <div class="card-title">
              <span>今日专注</span>
              <i data-lucide="chevron-right"></i>
            </div>
            <div class="summary-grid">
              <div><span>专注次数</span><strong><b id="pomodoroCount">0</b> 次</strong></div>
              <div><span>专注时长</span><strong><b id="focusMinutes">0</b> 分钟</strong></div>
              <div><span>完成任务</span><strong><b id="todayPlanCount">0</b> 个</strong></div>
            </div>
          </section>
        </section>

        <section class="app-section" id="plans">
          <header class="page-header compact">
            <div>
              <p class="eyebrow">Task</p>
              <h2>任务</h2>
              <p>创建任务，设置优先级，减少拖延。</p>
            </div>
          </header>
          <form class="task-form" id="planForm">
            <input id="planTitle" type="text" placeholder="新增任务" autocomplete="off" />
            <input id="planDate" type="date" />
            <select id="planPriority" aria-label="优先级">
              <option value="高">高</option>
              <option value="中" selected>中</option>
              <option value="低">低</option>
            </select>
            <button type="submit" class="primary-mini" aria-label="新增任务"><i data-lucide="plus"></i></button>
          </form>
          <div class="segmented-tabs" aria-label="任务筛选">
            <button class="selected" data-filter="all">全部</button>
            <button data-filter="today">今天</button>
            <button data-filter="done">完成</button>
          </div>
          <div class="list" id="planList"></div>
        </section>

        <section class="app-section" id="checkins">
          <header class="page-header compact">
            <div>
              <p class="eyebrow">Growth</p>
              <h2>专注统计</h2>
              <p>看见今日、本周和连续专注。</p>
            </div>
          </header>
          <section class="growth-stats">
            <div><span>今日专注</span><strong><b id="todayFocusStat">0</b> 分钟</strong></div>
            <div><span>本周专注</span><strong><b id="weekFocusStat">0</b> 分钟</strong></div>
            <div><span>连续天数</span><strong><b id="streakStat">0</b> 天</strong></div>
          </section>
          <section class="chart-card">
            <div class="chart-header">
              <strong>专注趋势</strong>
              <div class="chart-tabs" aria-label="图表范围">
                <button class="selected" data-chart="day">Day</button>
                <button data-chart="week">Week</button>
                <button data-chart="month">Month</button>
              </div>
            </div>
            <div class="bar-chart" id="focusChart"></div>
          </section>
          <div class="list" id="focusHistory"></div>
        </section>

        <section class="app-section" id="subscriptions">
          <header class="page-header compact">
            <div>
              <p class="eyebrow">Profile</p>
              <h2>我的</h2>
              <p>等级、EXP、会员中心和设置。</p>
            </div>
          </header>
          <section class="profile-card">
            <div class="profile-avatar"><img src="assets/dog-mascot.png?v=2" alt="大黄狗" /></div>
            <div class="profile-copy">
              <strong>大黄狗 Lv.<span id="levelValue">1</span></strong>
              <span id="membershipStatus">免费版</span>
              <div class="exp-track"><span id="expBar"></span></div>
              <small><b id="expValue">0</b> / 100 EXP</small>
            </div>
          </section>
          <section class="profile-metrics">
            <div><span>连续专注</span><strong><b id="profileStreak">0</b> 天</strong></div>
            <div><span>总专注</span><strong><b id="profileMinutes">0</b> 分钟</strong></div>
          </section>
          <section class="membership-center">
            <article class="membership-card" data-plan="monthly">
              <span>月会员</span><strong>¥18/月</strong><button>选择月会员</button>
            </article>
            <article class="membership-card featured" data-plan="yearly">
              <span>年会员</span><strong>¥168/年</strong><button>选择年会员</button>
            </article>
          </section>
          <section class="settings-list">
            <button><i data-lucide="settings"></i><span>设置</span><i data-lucide="chevron-right"></i></button>
            <button><i data-lucide="message-circle"></i><span>反馈</span><i data-lucide="chevron-right"></i></button>
          </section>
        </section>
      </main>

      <nav class="bottom-tabs" aria-label="底部导航">
        <a href="#timer" class="active"><span class="tab-icon">🍅</span><span>Focus</span></a>
        <a href="#plans"><span class="tab-icon">📋</span><span>Task</span></a>
        <a href="#checkins"><span class="tab-icon">🌱</span><span>Growth</span></a>
        <a href="#subscriptions"><span class="tab-icon">🐶</span><span>Profile</span></a>
      </nav>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="app.js?v=13"></script>
  </body>
</html>
